<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }

  #game-title {
    color: #e8e8f0;
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.4;
    font-weight: 400;
  }

  #canvas-wrapper {
    position: relative;
    border: 2px solid #2a2a3a;
    transition: border-color 0.05s;
  }

  #canvas-wrapper.flash-miss {
    border-color: #ff3344;
    box-shadow: 0 0 30px rgba(255,51,68,0.5), inset 0 0 30px rgba(255,51,68,0.08);
  }

  #canvas-wrapper.flash-hit {
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  #round-label {
    color: #e8e8f0;
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    height: 20px;
  }

  #round-label.visible { opacity: 0.6; }
</style>
</head>
<body>

<div id="game-title">Pulse</div>
<div id="canvas-wrapper">
  <canvas id="gameCanvas" width="600" height="500"></canvas>
</div>
<div id="round-label"></div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const CANVAS_W        = 600;
const CANVAS_H        = 500;
const INITIAL_LIVES   = 3;
const HIT_FLASH_MS    = 80;
const MISS_FLASH_MS   = 200;
const PULSE_AMP       = 4;
const PULSE_FREQ      = 2;
const HITS_PER_ROUND  = 5;   // complete a round every 5 hits

// Per-round tuning table  [startRadius, shrinkRate px/ms]
// Rounds 1-3: big target, slow shrink — easy warmup
// Round 4+: shrinkRate grows faster; radius shrinks each round
const ROUND_CONFIG = [
  /*R1*/ { radius: 70, shrink: 0.012 },
  /*R2*/ { radius: 65, shrink: 0.015 },
  /*R3*/ { radius: 60, shrink: 0.018 },
  /*R4*/ { radius: 55, shrink: 0.022 },
  /*R5*/ { radius: 50, shrink: 0.027 },
  /*R6*/ { radius: 45, shrink: 0.033 },
  /*R7*/ { radius: 42, shrink: 0.040 },
  /*R8*/ { radius: 38, shrink: 0.048 },
  /*R9*/ { radius: 35, shrink: 0.057 },
];
// Beyond table: keep min radius 32, multiply last shrink by 1.12 each round
function getRoundConfig(roundNum) {
  const idx = roundNum - 1;
  if (idx < ROUND_CONFIG.length) return { ...ROUND_CONFIG[idx] };
  const base = ROUND_CONFIG[ROUND_CONFIG.length - 1];
  const extra = roundNum - ROUND_CONFIG.length;
  return {
    radius: Math.max(32, base.radius - extra * 2),
    shrink: base.shrink * Math.pow(1.12, extra),
  };
}

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('gameCanvas');
const ctx      = canvas.getContext('2d');
const wrapper  = document.getElementById('canvas-wrapper');
const roundEl  = document.getElementById('round-label');

// ─── Game State ───────────────────────────────────────────────────────────────
let gs = {};

function makeInitialState(round) {
  const cfg = getRoundConfig(round);
  return {
    score:        0,        // total hits ever
    roundHits:    0,        // hits within current round
    lives:        INITIAL_LIVES,
    isPlaying:    false,
    round:        round,
    circleX:      CANVAS_W / 2,
    circleY:      CANVAS_H / 2,
    circleRadius: cfg.radius,
    startRadius:  cfg.radius,
    shrinkRate:   cfg.shrink,
    flashColor:   null,
    flashTimer:   0,
  };
}

// ─── Screens ──────────────────────────────────────────────────────────────────
// 'start' | 'transition' | 'playing' | 'gameover'
let gameState     = 'start';
let lastTime      = null;
let rafId         = null;
let currentRound  = 1;
let totalScore    = 0;   // persists across rounds within a session

// Transition state
let transitionRound     = 1;
let transitionTimer     = 0;   // ms elapsed in transition
const TRANSITION_MS     = 3000;
// Countdown: show "3", "2", "1" then go
// Phase 0: 0–800ms  → "Round N"
// Phase 1: 800–1600 → "3"
// Phase 2: 1600–2400→ "2"
// Phase 3: 2400–3000→ "1"

// ─── Spawn System ─────────────────────────────────────────────────────────────
function spawnMargin() { return gs.startRadius + 10; }

function randomPosition() {
  const m = spawnMargin();
  return {
    x: m + Math.random() * (CANVAS_W - 2 * m),
    y: m + Math.random() * (CANVAS_H - 2 * m),
  };
}

function spawnCircle() {
  const pos = randomPosition();
  gs.circleX      = pos.x;
  gs.circleY      = pos.y;
  gs.circleRadius = gs.startRadius;
}

// ─── Hit / Miss ───────────────────────────────────────────────────────────────
function triggerHit() {
  gs.score     += 1;
  gs.roundHits += 1;
  totalScore   += 1;
  gs.flashColor = 'white';
  gs.flashTimer = HIT_FLASH_MS;

  if (gs.roundHits >= HITS_PER_ROUND) {
    // Round complete → transition
    gs.isPlaying = false;
    beginTransition(gs.round + 1);
  } else {
    spawnCircle();
  }
}

function triggerMiss() {
  gs.lives -= 1;
  gs.flashColor = 'red';
  gs.flashTimer = MISS_FLASH_MS;
  if (gs.lives <= 0) {
    gs.isPlaying = false;
    gameState    = 'gameover';
  } else {
    spawnCircle();
  }
}

// ─── Transition ───────────────────────────────────────────────────────────────
function beginTransition(nextRound) {
  transitionRound = nextRound;
  transitionTimer = 0;
  gameState       = 'transition';
  updateRoundLabel(nextRound);
}

function updateRoundLabel(r) {
  roundEl.textContent = 'Round ' + r;
  roundEl.classList.add('visible');
}

function finishTransition() {
  currentRound = transitionRound;
  // Carry lives over; reset round-specific state
  const savedLives = gs.lives;
  gs = makeInitialState(currentRound);
  gs.lives        = savedLives;
  gs.isPlaying    = true;
  gameState       = 'playing';
  spawnCircle();
}

// ─── Border flash ─────────────────────────────────────────────────────────────
let borderFlashTimeout = null;
function triggerBorderFlash(type) {
  wrapper.classList.remove('flash-miss', 'flash-hit');
  void wrapper.offsetWidth;
  wrapper.classList.add(type === 'red' ? 'flash-miss' : 'flash-hit');
  clearTimeout(borderFlashTimeout);
  borderFlashTimeout = setTimeout(() => {
    wrapper.classList.remove('flash-miss', 'flash-hit');
  }, type === 'red' ? MISS_FLASH_MS : HIT_FLASH_MS);
}

// ─── Input ────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', (e) => {
  const r = canvas.getBoundingClientRect();
  handleClick(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  handleClick(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });

function handleClick(cx, cy) {
  if (gameState === 'start') { startGame(); return; }
  if (gameState === 'gameover') { restart(); return; }
  if (gameState === 'transition') return; // no interaction during transition
  if (!gs.isPlaying) return;

  const dx = cx - gs.circleX, dy = cy - gs.circleY;
  if (Math.sqrt(dx*dx + dy*dy) <= gs.circleRadius) {
    triggerHit();
    triggerBorderFlash('white');
  } else {
    triggerMiss();
    triggerBorderFlash('red');
  }
}

// ─── Game lifecycle ───────────────────────────────────────────────────────────
function startGame() {
  currentRound = 1;
  totalScore   = 0;
  gs           = makeInitialState(1);
  gs.isPlaying = true;
  gameState    = 'playing';
  updateRoundLabel(1);
  spawnCircle();
  lastTime = null;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(gameLoop);
}

function restart() {
  roundEl.classList.remove('visible');
  startGame();
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (lastTime === null) lastTime = timestamp;
  const dt = timestamp - lastTime;
  lastTime  = timestamp;

  // Transition timer
  if (gameState === 'transition') {
    transitionTimer += dt;
    if (transitionTimer >= TRANSITION_MS) finishTransition();
  }

  // Shrink
  if (gameState === 'playing' && gs.isPlaying) {
    gs.circleRadius -= gs.shrinkRate * dt;
    if (gs.circleRadius <= 0) {
      gs.circleRadius = 0;
      triggerMiss();
      triggerBorderFlash('red');
    }
  }

  // Flash countdown
  if (gs.flashTimer > 0) {
    gs.flashTimer -= dt;
    if (gs.flashTimer < 0) { gs.flashTimer = 0; gs.flashColor = null; }
  }

  render(timestamp);
  rafId = requestAnimationFrame(gameLoop);
}

// ─── Renderer ─────────────────────────────────────────────────────────────────
function render(ts) {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  if (gameState === 'start')      { renderStart(ts); return; }
  if (gameState === 'transition') { renderTransition(ts); return; }
  if (gameState === 'playing')    { renderGame(ts); return; }
  if (gameState === 'gameover')   { renderGame(ts); renderGameOver(); }
}

// ── Start screen ──────────────────────────────────────────────────────────────
function renderStart(ts) {
  const t = ts / 1000;
  const r = 70 + PULSE_AMP * Math.sin(2 * Math.PI * PULSE_FREQ * t);

  ctx.beginPath();
  ctx.arc(CANVAS_W/2, CANVAS_H/2, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(230,230,255,0.55)';
  ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = 'center';

  // Title
  ctx.font = 'bold 48px "Courier New", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('PULSE', CANVAS_W/2, CANVAS_H/2 - 100);

  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,200,220,0.65)';
  ctx.fillText('click to start', CANVAS_W/2, CANVAS_H/2 + 90);

  // HUD preview
  drawLives(INITIAL_LIVES, INITIAL_LIVES);
  drawScore(0, 1);
}

// ── Transition screen ─────────────────────────────────────────────────────────
function renderTransition(ts) {
  const progress = transitionTimer / TRANSITION_MS; // 0→1

  // Green background
  const greenAlpha = Math.min(1, progress * 3);
  ctx.fillStyle = `rgba(20, 90, 50, ${greenAlpha * 0.92})`;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Radial glow from center
  const grd = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, 0, CANVAS_W/2, CANVAS_H/2, 320);
  grd.addColorStop(0, `rgba(80,220,120,${greenAlpha * 0.25})`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.textAlign = 'center';

  // "ROUND COMPLETE" (fades in first 600ms)
  const completeAlpha = Math.min(1, transitionTimer / 600);
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillStyle = `rgba(140,255,170,${completeAlpha})`;
  ctx.fillText('ROUND COMPLETE', CANVAS_W/2, CANVAS_H/2 - 80);

  // "ROUND N" — big, centered
  ctx.font = 'bold 56px "Courier New", monospace';
  ctx.fillStyle = `rgba(255,255,255,${completeAlpha})`;
  ctx.fillText('ROUND ' + transitionRound, CANVAS_W/2, CANVAS_H/2 - 10);

  // Countdown number (phases at 800/1600/2400ms)
  let countNum = null;
  if (transitionTimer >= 800  && transitionTimer < 1600) countNum = '3';
  if (transitionTimer >= 1600 && transitionTimer < 2400) countNum = '2';
  if (transitionTimer >= 2400)                           countNum = '1';

  if (countNum !== null) {
    // Phase progress for fade-in per number
    const phaseStart = countNum === '3' ? 800 : countNum === '2' ? 1600 : 2400;
    const phaseAlpha = Math.min(1, (transitionTimer - phaseStart) / 200);
    ctx.font = 'bold 80px "Courier New", monospace';
    ctx.fillStyle = `rgba(255,255,255,${phaseAlpha})`;
    ctx.fillText(countNum, CANVAS_W/2, CANVAS_H/2 + 90);
  }

  // "GET READY" label beneath countdown
  if (transitionTimer >= 800) {
    const rdyAlpha = Math.min(1, (transitionTimer - 800) / 300);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = `rgba(180,255,200,${rdyAlpha * 0.7})`;
    ctx.fillText('GET READY', CANVAS_W/2, CANVAS_H/2 + 150);
  }

  // Score & lives carry-over reminder
  ctx.font = '15px "Courier New", monospace';
  ctx.fillStyle = `rgba(200,255,220,${completeAlpha * 0.6})`;
  ctx.fillText('Score: ' + totalScore + '   ♥'.repeat(gs.lives), CANVAS_W/2, 40);
}

// ── Playing screen ────────────────────────────────────────────────────────────
function renderGame(ts) {
  const t = ts / 1000;
  const renderR = Math.max(0, gs.circleRadius + PULSE_AMP * Math.sin(2 * Math.PI * PULSE_FREQ * t));

  // Flash overlay
  if (gs.flashColor && gs.flashTimer > 0) {
    const a = gs.flashColor === 'white' ? 0.18 : 0.12;
    ctx.fillStyle = gs.flashColor === 'white' ? `rgba(255,255,255,${a})` : `rgba(255,50,60,${a})`;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  }

  if (renderR > 0) {
    // Glow
    const glow = ctx.createRadialGradient(gs.circleX, gs.circleY, renderR*0.4, gs.circleX, gs.circleY, renderR*1.7);
    glow.addColorStop(0, 'rgba(220,220,255,0.13)');
    glow.addColorStop(1, 'rgba(220,220,255,0)');
    ctx.beginPath(); ctx.arc(gs.circleX, gs.circleY, renderR*1.7, 0, Math.PI*2);
    ctx.fillStyle = glow; ctx.fill();

    // Fill
    ctx.beginPath(); ctx.arc(gs.circleX, gs.circleY, renderR, 0, Math.PI*2);
    const fa = 0.55 + 0.45 * (gs.circleRadius / gs.startRadius);
    ctx.fillStyle = `rgba(230,230,255,${fa})`; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
  }

  renderHUD();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function renderHUD() {
  drawLives(gs.lives, INITIAL_LIVES);
  drawScore(totalScore, gs.round);

  // Round progress pips — bottom center
  ctx.textAlign = 'center';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,200,220,0.55)';
  let pips = '';
  for (let i = 0; i < HITS_PER_ROUND; i++) {
    pips += i < gs.roundHits ? '● ' : '○ ';
  }
  ctx.fillText(pips.trim(), CANVAS_W/2, CANVAS_H - 14);
}

function drawLives(lives, max) {
  ctx.textAlign = 'left';
  ctx.font = '22px serif';
  for (let i = 0; i < max; i++) {
    ctx.fillStyle = i < lives ? '#ff4466' : 'rgba(255,68,102,0.22)';
    ctx.fillText(i < lives ? '♥' : '♡', 14 + i * 28, 34);
  }
}

function drawScore(score, round) {
  ctx.textAlign = 'right';
  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = 'rgba(240,240,255,0.9)';
  ctx.fillText('Score: ' + score, CANVAS_W - 16, 24);
  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = 'rgba(180,180,210,0.6)';
  ctx.fillText('Round ' + round, CANVAS_W - 16, 42);
}

// ── Game Over screen ──────────────────────────────────────────────────────────
function renderGameOver() {
  // Overlay
  ctx.fillStyle = 'rgba(4,4,12,0.88)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.textAlign = 'center';

  // Heading
  ctx.font = 'bold 50px "Courier New", monospace';
  ctx.fillStyle = '#ff3355';
  ctx.fillText('GAME OVER', CANVAS_W/2, CANVAS_H/2 - 80);

  // Divider line
  ctx.strokeStyle = 'rgba(255,51,85,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CANVAS_W/2 - 140, CANVAS_H/2 - 52);
  ctx.lineTo(CANVAS_W/2 + 140, CANVAS_H/2 - 52);
  ctx.stroke();

  // Score
  ctx.font = 'bold 32px "Courier New", monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Score: ' + totalScore, CANVAS_W/2, CANVAS_H/2 - 10);

  // Round reached
  ctx.font = '22px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,200,230,0.85)';
  ctx.fillText('Reached Round ' + gs.round, CANVAS_W/2, CANVAS_H/2 + 28);

  // Divider
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath();
  ctx.moveTo(CANVAS_W/2 - 100, CANVAS_H/2 + 50);
  ctx.lineTo(CANVAS_W/2 + 100, CANVAS_H/2 + 50);
  ctx.stroke();

  // Restart prompt — pulsing opacity using Date.now()
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 500);
  ctx.font = '18px "Courier New", monospace';
  ctx.fillStyle = `rgba(220,220,255,${0.5 + pulse * 0.4})`;
  ctx.fillText('click to restart', CANVAS_W/2, CANVAS_H/2 + 84);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
gs    = makeInitialState(1);
rafId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
